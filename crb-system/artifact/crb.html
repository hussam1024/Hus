<title>منتدى الإغاثة والبناء</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ================================================================
   منتدى الإغاثة والبناء — نظام الإدارة المتكامل
   Brand: green #01A453 · orange #EF7023 (from the official logo)
   ================================================================ */

:root {
  --green: #01a453; --green-600: #018a46; --green-700: #0b6e3a; --green-800: #0a5530;
  --green-50: #e9f7ef; --green-100: #d3efdf;
  --orange: #ef7023; --orange-600: #d65e14; --orange-50: #fdf0e7; --orange-100: #fbdcc6;
  --bg: #f4f6f4; --surface: #ffffff; --surface-2: #f8faf8; --line: #e3e8e4; --line-2: #eef1ee;
  --ink: #1b2a22; --ink-2: #4a5a51; --ink-3: #7b8a81;
  --blue: #1769aa; --blue-50: #e8f1fa; --red: #c62828; --red-50: #fdecec; --amber: #b7791f; --amber-50: #fdf5e6; --purple: #6c4bb4; --purple-50: #f1edfa;
  --radius: 14px; --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16, 40, 26, .05), 0 4px 16px rgba(16, 40, 26, .06);
  --shadow-lg: 0 10px 40px rgba(16, 40, 26, .18);
  --sidebar: 268px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #16201a; --surface-2: #1b2720; --line: #263429; --line-2: #1f2c24;
  --ink: #e6efe9; --ink-2: #b2c2b8; --ink-3: #82958a;
  --green-50: #12301f; --green-100: #174029; --orange-50: #3a2414; --orange-100: #4a2c16;
  --blue-50: #13283a; --red-50: #3a1717; --amber-50: #382a12; --purple-50: #261d3a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #16201a; --surface-2: #1b2720; --line: #263429; --line-2: #1f2c24;
    --ink: #e6efe9; --ink-2: #b2c2b8; --ink-3: #82958a;
    --green-50: #12301f; --green-100: #174029; --orange-50: #3a2414; --orange-100: #4a2c16;
    --blue-50: #13283a; --red-50: #3a1717; --amber-50: #382a12; --purple-50: #261d3a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14.5px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--green-600); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }
.nowrap { white-space: nowrap; }

/* ---------------- layout ---------------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line-2); }
.brand img { width: 46px; height: 48px; border-radius: 10px; }
.brand .t1 { font-weight: 700; color: var(--green-700); font-size: 15.5px; }
.brand .t2 { font-size: 11px; color: var(--ink-3); direction: ltr; text-align: right; }
:root[data-theme="dark"] .brand .t1 { color: #4fd18b; }
.nav { padding: 10px 10px 30px; flex: 1; }
.nav-group { margin-top: 12px; }
.nav-group > .label { font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 4px 12px; letter-spacing: .2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 10px; color: var(--ink-2);
  font-weight: 500; position: relative; margin: 1px 0; text-decoration: none;
}
.nav a svg { width: 19px; height: 19px; flex: none; opacity: .85; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.active { background: var(--green-50); color: var(--green-700); font-weight: 600; }
:root[data-theme="dark"] .nav a.active { color: #6fe0a2; }
.nav a.active::before { content: ''; position: absolute; right: -10px; top: 8px; bottom: 8px; width: 4px; border-radius: 4px 0 0 4px; background: var(--green); }
.nav .badge { margin-inline-start: auto; }
.sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--line-2); font-size: 11.5px; color: var(--ink-3); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 24px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input { width: 100%; padding: 9px 40px 9px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
.search input:focus { outline: 2px solid var(--green-100); border-color: var(--green); background: var(--surface); }
.search > svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 18px; color: var(--ink-3); }
.search-results { position: absolute; top: calc(100% + 6px); right: 0; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; max-height: 420px; overflow-y: auto; }
.search-results a { display: flex; gap: 10px; padding: 9px 14px; color: var(--ink); border-bottom: 1px solid var(--line-2); text-decoration: none; }
.search-results a:hover { background: var(--green-50); }
.top-actions { display: flex; align-items: center; gap: 6px; margin-inline-start: auto; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn .dot { position: absolute; top: 5px; left: 5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 6px 4px 12px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; }
.user-chip:hover { background: var(--surface-2); }
.user-chip .who { text-align: right; line-height: 1.25; }
.user-chip .who b { display: block; font-size: 13.5px; }
.user-chip .who span { font-size: 11.5px; color: var(--ink-3); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; background: var(--green); }
.avatar.sm { width: 28px; height: 28px; font-size: 12px; }
.avatar.lg { width: 64px; height: 64px; font-size: 24px; }
.dropdown { position: absolute; top: 56px; left: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); min-width: 250px; padding: 6px; z-index: 50; }
.dropdown a, .dropdown button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 9px; color: var(--ink); background: none; border: 0; cursor: pointer; text-align: right; text-decoration: none; }
.dropdown a:hover, .dropdown button:hover { background: var(--surface-2); }
.dropdown svg { width: 18px; height: 18px; color: var(--ink-3); }
.dropdown hr { border: 0; border-top: 1px solid var(--line-2); margin: 5px 0; }

.content { padding: 24px; max-width: 1480px; width: 100%; margin: 0 auto; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 23px; display: flex; align-items: center; gap: 10px; }
.page-head h1 svg { width: 26px; height: 26px; color: var(--green); }
.page-head p { margin: 4px 0 0; color: var(--ink-3); }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------- primitives ---------------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line-2); }
.card-head h3 { font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.card-head h3 svg { width: 19px; height: 19px; color: var(--green); }
.card-body { padding: 16px 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8.5px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s; text-decoration: none !important; font-size: 14px;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-600); }
.btn.accent { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.accent:hover { background: var(--orange-600); }
.btn.danger { color: var(--red); border-color: var(--red-50); }
.btn.danger:hover { background: var(--red-50); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.green { background: var(--green-50); color: var(--green-700); border-color: var(--green-100); }
.badge.orange { background: var(--orange-50); color: var(--orange-600); border-color: var(--orange-100); }
.badge.red { background: var(--red-50); color: var(--red); border-color: #f3c4c4; }
.badge.blue { background: var(--blue-50); color: var(--blue); border-color: #c8dcef; }
.badge.amber { background: var(--amber-50); color: var(--amber); border-color: #f0dcb3; }
.badge.purple { background: var(--purple-50); color: var(--purple); border-color: #dcd2f0; }
.badge.solid { background: var(--orange); color: #fff; border-color: var(--orange); }
:root[data-theme="dark"] .badge.green { color: #6fe0a2; }
.dot-c { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* form */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.input, .field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea, select.input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: border-color .15s, box-shadow .15s;
}
.field textarea { min-height: 90px; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-100); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--green); margin-top: 3px; flex: none; }

/* tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: right; font-size: 12.5px; color: var(--ink-3); font-weight: 600; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.clickable { cursor: pointer; }
.t .title-cell b { display: block; }
.t .title-cell span { font-size: 12px; color: var(--ink-3); }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 10px 16px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--ink-3); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tabs button svg { width: 17px; height: 17px; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--green-700); border-bottom-color: var(--green); }
:root[data-theme="dark"] .tabs button.active { color: #6fe0a2; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink-3); font-size: 13px; }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* stat tiles */
.stat { padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.stat .ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; flex: none; }
.stat .ic svg { width: 23px; height: 23px; }
.stat .v { font-size: 25px; font-weight: 700; line-height: 1.15; }
.stat .l { color: var(--ink-3); font-size: 12.5px; }
.ic.green { background: var(--green-50); color: var(--green); }
.ic.orange { background: var(--orange-50); color: var(--orange); }
.ic.blue { background: var(--blue-50); color: var(--blue); }
.ic.red { background: var(--red-50); color: var(--red); }
.ic.purple { background: var(--purple-50); color: var(--purple); }

/* hero */
.hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 24px 26px; color: #fff; margin-bottom: 18px;
  background: linear-gradient(120deg, #0b6e3a 0%, #01a453 55%, #2fbf6e 100%);
}
.hero::after { content: ''; position: absolute; left: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(239,112,35,.55), rgba(239,112,35,0) 70%); }
.hero h2 { font-size: 22px; }
.hero p { margin: 6px 0 0; opacity: .9; }
.hero .hero-meta { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero .hero-meta div { background: rgba(255,255,255,.14); padding: 7px 14px; border-radius: 10px; font-size: 13px; }
.hero .hero-meta b { font-size: 17px; margin-inline-end: 4px; }

/* list items */
.list-item { display: flex; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line-2); align-items: flex-start; text-decoration: none !important; color: var(--ink); }
.list-item:last-child { border-bottom: 0; }
a.list-item:hover { background: var(--surface-2); }
.list-item .body { flex: 1; min-width: 0; }
.list-item .body b { display: block; }
.list-item .meta { font-size: 12.5px; color: var(--ink-3); }
.empty { text-align: center; padding: 34px 20px; color: var(--ink-3); }
.empty svg { width: 42px; height: 42px; opacity: .35; display: block; margin: 0 auto 8px; }

/* bars (single-series charts) */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 12px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--green); border-radius: 4px; min-width: 2px; }
.bar-row .val { font-weight: 600; text-align: left; direction: ltr; }
.vbars { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 10px; }
.vbars .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.vbars .col .b { width: 100%; max-width: 34px; background: var(--green); border-radius: 4px 4px 0 0; min-height: 2px; }
.vbars .col .b.alt { background: var(--orange); }
.vbars .col span { font-size: 11px; color: var(--ink-3); }
.vbars .col .vv { font-size: 11px; font-weight: 600; color: var(--ink-2); }
.progress { height: 8px; background: var(--line-2); border-radius: 6px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--green), #2fbf6e); border-radius: 6px; }

/* stepper / workflow */
.pipeline { display: flex; gap: 3px; margin: 8px 0 2px; }
.pipeline i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.pipeline i.done { background: var(--green); }
.pipeline i.cur { background: var(--orange); }
.stages { position: relative; }
.stage { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding-bottom: 18px; }
.stage::before { content: ''; position: absolute; right: 21px; top: 44px; bottom: 0; width: 2px; background: var(--line); }
.stage:last-child::before { display: none; }
.stage.done::before { background: var(--green); }
.stage .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); border: 2px solid var(--line); color: var(--ink-3); z-index: 1; position: relative; }
.stage.done .n { background: var(--green); border-color: var(--green); color: #fff; }
.stage.current .n, .stage.approval .n { background: var(--orange); border-color: var(--orange); color: #fff; box-shadow: 0 0 0 6px var(--orange-50); }
.stage .box { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.stage.current .box, .stage.approval .box { border-color: var(--orange); box-shadow: 0 6px 24px rgba(239,112,35,.12); }
.stage .box-head { padding: 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; cursor: pointer; }
.stage .box-head h4 { font-size: 14.5px; }
.stage .box-body { padding: 0 14px 14px; }
.stage.future .box-head h4 { color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 130px 1fr; border: 1px solid var(--green-100); border-radius: 10px; overflow: hidden; font-size: 13.5px; }
.kv > div { padding: 7px 12px; border-bottom: 1px solid var(--green-100); }
.kv > div:nth-child(odd) { background: var(--green-50); font-weight: 600; color: var(--green-700); }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
:root[data-theme="dark"] .kv > div:nth-child(odd) { color: #6fe0a2; }
.checklist { display: flex; flex-direction: column; gap: 7px; margin: 12px 0; }
.checklist .check { padding: 9px 12px; border: 1px dashed var(--line); border-radius: 10px; }
.checklist .check.done { border-style: solid; border-color: var(--green-100); background: var(--green-50); }
.checklist .check.locked { opacity: .75; cursor: default; }
.gate { padding: 9px 12px; border-radius: 10px; background: var(--amber-50); color: var(--amber); font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.gate svg { width: 18px; flex: none; margin-top: 2px; }
.note-box { padding: 10px 14px; border-radius: 10px; background: var(--blue-50); color: var(--blue); font-size: 13px; }

/* timeline */
.timeline { position: relative; padding-right: 18px; }
.timeline::before { content: ''; position: absolute; right: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.tl { position: relative; padding: 0 0 14px 0; }
.tl::before { content: ''; position: absolute; right: -18px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--green); }
.tl.returned::before { border-color: var(--red); }
.tl.approved::before, .tl.closed::before { background: var(--green); }
.tl.comment::before { border-color: var(--blue); }
.tl .when { font-size: 12px; color: var(--ink-3); }

/* kanban */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 300px; }
.kcol h4 { font-size: 13.5px; padding: 4px 6px 10px; display: flex; justify-content: space-between; }
.kcol.drag-over { outline: 2px dashed var(--green); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.kcard:hover { border-color: var(--green-100); }
.kcard b { display: block; font-size: 13.5px; }
.prio-urgent { border-right: 4px solid var(--red) !important; }
.prio-high { border-right: 4px solid var(--orange) !important; }

/* chat */
.chat { display: grid; grid-template-columns: 290px 1fr; height: calc(100vh - 150px); min-height: 480px; overflow: hidden; }
.chat-side { border-left: 1px solid var(--line); overflow-y: auto; background: var(--surface-2); border-radius: 0 var(--radius) var(--radius) 0; }
.chat-side .sec { padding: 12px 14px 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; }
.chan { display: flex; align-items: center; gap: 9px; padding: 8px 14px; color: var(--ink-2); cursor: pointer; text-decoration: none !important; }
.chan:hover { background: var(--surface); }
.chan.active { background: var(--green-50); color: var(--green-700); font-weight: 600; }
.chan .hash { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-size: 13px; flex: none; }
.chan .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-main { display: flex; flex-direction: column; min-width: 0; }
.chat-head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 16px 18px; }
.msg { display: flex; gap: 11px; padding: 6px 8px; border-radius: 10px; position: relative; }
.msg:hover { background: var(--surface-2); }
.msg .mb { flex: 1; min-width: 0; }
.msg .mh { display: flex; gap: 8px; align-items: baseline; }
.msg .mh b { font-size: 13.5px; }
.msg .mh span { font-size: 11.5px; color: var(--ink-3); }
.msg .text { white-space: pre-wrap; word-wrap: break-word; }
.msg .text .mention { direction: ltr; unicode-bidi: isolate; display: inline-block; background: var(--orange-50); color: var(--orange-600); padding: 0 4px; border-radius: 5px; font-weight: 600; }
.msg .reply { border-right: 3px solid var(--green-100); padding: 2px 9px; margin: 3px 0; font-size: 12.5px; color: var(--ink-3); background: var(--surface-2); border-radius: 6px; }
.msg .tools { position: absolute; left: 8px; top: -12px; display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); padding: 2px; }
.msg:hover .tools { display: flex; }
.msg .tools button { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 6px; font-size: 14px; }
.msg .tools button:hover { background: var(--surface-2); }
.reacts { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
.reacts button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 0 8px; font-size: 12.5px; cursor: pointer; }
.reacts button.me { border-color: var(--green); background: var(--green-50); }
.msg.pinned { background: var(--orange-50); }
.day-sep { text-align: center; margin: 12px 0; font-size: 12px; color: var(--ink-3); }
.day-sep span { background: var(--surface); padding: 2px 12px; border-radius: 10px; border: 1px solid var(--line); }
.composer { border-top: 1px solid var(--line); padding: 12px 16px; }
.composer .replying { font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; display: flex; justify-content: space-between; }
.composer form { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.composer textarea:focus { outline: none; border-color: var(--green); background: var(--surface); }
.pinned-bar { padding: 7px 18px; background: var(--orange-50); font-size: 12.5px; border-bottom: 1px solid var(--orange-100); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
.cal .dh { padding: 8px; font-size: 12px; font-weight: 700; color: var(--ink-3); text-align: center; background: var(--surface-2); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal .d { min-height: 104px; padding: 6px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
.cal .d.out { background: var(--surface-2); }
.cal .d.today { box-shadow: inset 0 0 0 2px var(--green); }
.cal .d .dn { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.cal .ev { display: block; font-size: 11.5px; padding: 2px 6px; border-radius: 5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); text-decoration: none !important; }
.ev.execution { background: var(--green-50); border-right: 3px solid var(--green); }
.ev.deadline { background: var(--red-50); border-right: 3px solid var(--red); }
.ev.meeting { background: var(--blue-50); border-right: 3px solid var(--blue); }
.ev.task { background: var(--orange-50); border-right: 3px solid var(--orange); }
.ev.media { background: var(--purple-50); border-right: 3px solid var(--purple); }
.ev.leave { background: var(--amber-50); border-right: 3px solid var(--amber); }

/* matrix */
.matrix th, .matrix td { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: right; position: sticky; right: 0; background: var(--surface); z-index: 1; }
.matrix th { position: sticky; top: 0; z-index: 2; }
.matrix th.vert { white-space: normal; min-width: 84px; max-width: 110px; font-size: 12px; line-height: 1.35; vertical-align: bottom; padding: 10px 6px; }
.matrix .grp td { background: var(--green-50); font-weight: 700; color: var(--green-700); text-align: right; }
.matrix input { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; }
.yes { color: var(--green); font-weight: 700; }
.no { color: var(--line); }

/* modal & toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 25, 17, .45); display: grid; place-items: center; z-index: 100; padding: 16px; animation: fade .15s; }
.modal { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); width: min(640px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; animation: pop .18s; }
.modal.wide { width: min(960px, 100%); }
.modal-head { padding: 16px 22px; border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; align-items: center; }
.modal-head h3 { font-size: 17px; }
.modal-body { padding: 18px 22px; overflow-y: auto; }
.modal-foot { padding: 12px 22px; border-top: 1px solid var(--line-2); display: flex; gap: 8px; justify-content: flex-start; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
.toasts { position: fixed; bottom: 20px; left: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; box-shadow: var(--shadow-lg); max-width: 380px; animation: pop .2s; display: flex; gap: 9px; align-items: center; }
:root[data-theme="dark"] .toast { background: #2a3a30; }
.toast.err { background: var(--red); }
.toast.ok { background: var(--green-700); }
.secret { font-family: ui-monospace, Consolas, monospace; font-size: 20px; background: var(--orange-50); border: 2px dashed var(--orange); padding: 12px; border-radius: 12px; text-align: center; letter-spacing: 1px; direction: ltr; user-select: all; }

/* login */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login .art { background: linear-gradient(150deg, #0a5530, #01a453 60%, #29b866); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login .art::before { content: ''; position: absolute; width: 520px; height: 520px; border-radius: 50%; left: -160px; bottom: -200px; background: radial-gradient(circle, rgba(239,112,35,.55), transparent 65%); }
.login .art h1 { font-size: 34px; position: relative; }
.login .art p { opacity: .9; font-size: 16px; max-width: 460px; position: relative; }
.login .art ul { list-style: none; padding: 0; margin: 24px 0 0; position: relative; display: grid; gap: 10px; }
.login .art li { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.12); padding: 10px 14px; border-radius: 12px; max-width: 460px; }
.login .art li svg { width: 20px; flex: none; }
.login .form-side { display: grid; place-items: center; padding: 32px; background: var(--surface); }
.login .box { width: min(400px, 100%); }
.login .box img { width: 96px; display: block; margin: 0 auto 14px; border-radius: 16px; }
.login .box h2 { text-align: center; font-size: 22px; color: var(--green-700); }
.login .box .sub { text-align: center; color: var(--ink-3); margin-bottom: 22px; direction: ltr; }
.login .err { background: var(--red-50); color: var(--red); padding: 9px 12px; border-radius: 10px; font-size: 13.5px; }

/* manual / guide */
.guide h2 { font-size: 18px; margin: 22px 0 10px; color: var(--green-700); }
.guide h3 { font-size: 15.5px; margin: 16px 0 6px; }
.guide p, .guide li { color: var(--ink-2); }
.guide .step-n { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; background: var(--orange); color: #fff; font-weight: 700; font-size: 13px; margin-inline-end: 8px; }
.section-title { background: var(--green); color: #fff; padding: 8px 16px; border-radius: 4px; border-left: 6px solid var(--orange); font-weight: 700; margin: 20px 0 12px; }

.skeleton { background: linear-gradient(90deg, var(--line-2) 25%, var(--surface-2) 50%, var(--line-2) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 10px; height: 90px; }
@keyframes sk { to { background-position: -200% 0; } }

/* print */
.print-head { display: none; align-items: center; gap: 12px; border-bottom: 3px solid var(--green); padding-bottom: 10px; margin-bottom: 14px; }
.print-head img { width: 54px; }

/* responsive */
@media (max-width: 1150px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; right: 0; top: 0; width: 285px; transform: translateX(100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .topbar .menu-btn { display: inline-grid; }
  .topbar { padding: 8px 12px; }
  .content { padding: 16px; }
  .g2, .g3, .g4, .form-grid { grid-template-columns: 1fr; }
  .g4:has(> .stat), .g3:has(> .stat) { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 12px; gap: 10px; flex-direction: column; align-items: flex-start; }
  .stat .ic { width: 38px; height: 38px; }
  .stat .v { font-size: 20px; }
  .hero { padding: 18px; }
  .hero h2 { font-size: 19px; }
  .span2 { grid-column: auto; }
  .login { grid-template-columns: 1fr; }
  .login .art { display: none; }
  .chat { grid-template-columns: 1fr; height: calc(100vh - 130px); }
  .chat-side { display: none; }
  .chat.show-side .chat-side { display: block; }
  .chat.show-side .chat-main { display: none; }
  .user-chip .who { display: none; }
  .kv { grid-template-columns: 105px 1fr; }
  .search { max-width: none; }
}
@media (min-width: 901px) { .only-mobile { display: none !important; } }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
.toasts { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); }
.badge.green, .badge.orange, .badge.red, .badge.blue, .badge.amber, .badge.purple { border-color: transparent; }
.login .box .sub { margin-bottom: 18px; }
.login .box p { line-height: 1.8; }

// ---------- safe HTML templating (everything is escaped unless wrapped in raw()) ----------
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
function rend(v) {
  if (v === null || v === undefined || v === false) return '';
  if (v instanceof Raw) return v.s;
  if (Array.isArray(v)) return v.map(rend).join('');
  return esc(String(v));
}
function html(strings, ...vals) {
  let out = strings[0];
  for (let i = 0; i < vals.length; i++) out += rend(vals[i]) + strings[i + 1];
  return new Raw(out);
}
const raw = (s) => new Raw(s);
function mount(el, content) { el.innerHTML = rend(content); return el; }

// ---------- state ----------
const state = { user: null, org: {}, people: null, departments: null, settings: {} };

// ---------- API ----------
async function api(path, opts = {}) {
  const init = { method: opts.method || 'GET', headers: { 'X-CRB': '1' }, credentials: 'same-origin' };
  if (opts.body instanceof FormData) init.body = opts.body;
  else if (opts.body !== undefined) { init.body = JSON.stringify(opts.body); init.headers['Content-Type'] = 'application/json'; }
  const res = await fetch('/api' + path, init);
  let data = null;
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) {
    if (res.status === 401 && !path.startsWith('/auth/')) { location.hash = '#/'; location.reload(); }
    if (data && data.code === 'MUST_CHANGE_PASSWORD') { window.dispatchEvent(new Event('crb:must-change')); }
    const err = new Error((data && data.error) || 'تعذر الاتصال بالخادم');
    err.status = res.status; throw err;
  }
  return data;
}
const post = (p, body) => api(p, { method: 'POST', body: body || {} });
const patch = (p, body) => api(p, { method: 'PATCH', body });
const del = (p) => api(p, { method: 'DELETE' });

async function people(force) {
  if (!state.people || force) state.people = await api('/people');
  return state.people;
}
async function departments(force) {
  if (!state.departments || force) state.departments = await api('/admin/departments');
  return state.departments;
}

// ---------- formatting ----------
const dtf = new Intl.DateTimeFormat('ar-u-nu-latn', { year: 'numeric', month: 'short', day: 'numeric' });
const dtfl = new Intl.DateTimeFormat('ar-u-nu-latn', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const tf = new Intl.DateTimeFormat('ar-u-nu-latn', { hour: 'numeric', minute: '2-digit' });
const rtf = new Intl.RelativeTimeFormat('ar-u-nu-latn', { numeric: 'auto' });
function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/.test(s)) return new Date(s.replace(' ', 'T') + 'Z'); // SQLite UTC
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T00:00:00');
  return new Date(s);
}
const fmtDate = (s) => { const d = parseDate(s); return d && !isNaN(d) ? dtf.format(d) : '—'; };
const fmtDateTime = (s) => { const d = parseDate(s); return d && !isNaN(d) ? dtfl.format(d) : '—'; };
const fmtTime = (s) => { const d = parseDate(s); return d && !isNaN(d) ? tf.format(d) : ''; };
function ago(s) {
  const d = parseDate(s); if (!d) return '';
  const diff = (d - Date.now()) / 1000;
  const a = Math.abs(diff);
  if (a < 60) return 'الآن';
  if (a < 3600) return rtf.format(Math.round(diff / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(diff / 3600), 'hour');
  if (a < 86400 * 30) return rtf.format(Math.round(diff / 86400), 'day');
  return fmtDate(s);
}
const daysUntil = (s) => { const d = parseDate(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 864e5); };
const daysSince = (s) => { const d = parseDate(s); return d ? Math.floor((Date.now() - d) / 864e5) : 0; };
const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
const fmtNum = (n) => (n === null || n === undefined || n === '' ? '—' : nf.format(n));
const money = (n, cur = 'USD') => (n === null || n === undefined ? '—' : html`<span class="num">${nf.format(n)} ${cur === 'USD' ? '$' : cur}</span>`);
const fmtSize = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
const today = () => new Date().toISOString().slice(0, 10);
const initials = (name) => String(name || '؟').trim().split(/\s+/).slice(0, 2).map((w) => (w.length > 3 && w.startsWith('ال') ? w[2] : w[0])).join('');
const AV = ['#01a453', '#ef7023', '#1769aa', '#6c4bb4', '#c2185b', '#0b7a3e', '#d9631a', '#00838f'];
const avatarColor = (id) => AV[(Number(id) || 0) % AV.length];
const avatar = (u, cls = '') => html`<span class="avatar ${cls}" style="background:${raw(avatarColor(u.id || u.user_id))}" title="${u.full_name || ''}">${initials(u.full_name)}</span>`;

const STATUS = {
  priority: { normal: ['عادية', ''], high: ['مرتفعة', 'orange'], urgent: ['عاجلة', 'red'], low: ['منخفضة', 'blue'] },
};
const prioBadge = (p) => (p && p !== 'normal' ? html`<span class="badge ${(STATUS.priority[p] || [])[1]}">${(STATUS.priority[p] || [p])[0]}</span>` : '');

const icon = (name, attrs = '') => raw(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${attrs}>${P[name] || P.dots}</svg>`);

// ---------- events ----------
function on(root, type, selector, fn) {
  const h = (e) => { const t = e.target.closest(selector); if (t && root.contains(t)) fn(e, t); };
  root.addEventListener(type, h);
  return () => root.removeEventListener(type, h);
}

// ---------- toasts ----------
function toast(msg, kind = '') {
  let box = document.querySelector('.toasts');
  if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, kind === 'err' ? 5200 : 3200);
}
const fail = (e) => { if (!e || !e.silent) toast((e && e.message) || String(e), 'err'); };

// ---------- modal ----------
function modal({ title, body, foot, wide = false, onMount }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  mount(bg, html`<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="إغلاق">${icon('x')}</button></div>
    <div class="modal-body">${body}</div>
    ${foot ? html`<div class="modal-foot">${foot}</div>` : ''}
  </div>`);
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  bg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
  const m = { el: bg, body: bg.querySelector('.modal-body'), close };
  if (onMount) onMount(m);
  const first = bg.querySelector('input:not([type=checkbox]),select,textarea');
  if (first) setTimeout(() => first.focus(), 30);
  return m;
}
function confirmBox(message, { ok = 'تأكيد', danger = false } = {}) {
  return new Promise((resolve) => {
    const m = modal({
      title: 'تأكيد', body: html`<p style="margin:0">${message}</p>`,
      foot: html`<button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${ok}</button><button class="btn" data-close>إلغاء</button>`,
    });
    m.el.querySelector('[data-ok]').addEventListener('click', () => { m.close(); resolve(true); });
    m.el.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => resolve(false)));
  });
}

// ---------- forms ----------
function fieldHtml(f) {
  const id = 'f_' + f.name;
  const req = f.required ? raw(' <span style="color:var(--red)">*</span>') : '';
  const v = f.value ?? '';
  let input;
  switch (f.type) {
    case 'textarea': input = html`<textarea id="${id}" name="${f.name}" rows="${f.rows || 4}" placeholder="${f.placeholder || ''}">${v}</textarea>`; break;
    case 'select': input = html`<select id="${id}" name="${f.name}">${f.empty !== false ? html`<option value="">${f.empty || '— اختر —'}</option>` : ''}${(f.options || []).map((o) => {
      const [val, lab] = Array.isArray(o) ? o : [o.value, o.label];
      return html`<option value="${val}" ${String(val) === String(v) ? raw('selected') : ''}>${lab}</option>`;
    })}</select>`; break;
    case 'checkbox': return html`<label class="check ${f.full ? 'full' : ''}"><input type="checkbox" name="${f.name}" ${v ? raw('checked') : ''}><span>${f.label}${f.hint ? html`<br><span class="muted small">${f.hint}</span>` : ''}</span></label>`;
    case 'multi': input = html`<div style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:4px">${(f.options || []).map(([val, lab]) =>
      html`<label class="check"><input type="checkbox" name="${f.name}" value="${val}" ${(v || []).map(String).includes(String(val)) ? raw('checked') : ''}><span>${lab}</span></label>`)}</div>`; break;
    case 'html': return html`<div class="${f.full ? 'full' : ''}">${f.html}</div>`;
    default: input = html`<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${v}" placeholder="${f.placeholder || ''}" ${f.step ? raw(`step="${f.step}"`) : ''} ${f.min !== undefined ? raw(`min="${f.min}"`) : ''} ${f.max !== undefined ? raw(`max="${f.max}"`) : ''} ${f.dir ? raw(`dir="${f.dir}"`) : ''} autocomplete="off">`;
  }
  return html`<div class="field ${f.full || f.type === 'textarea' ? 'full' : ''}"><label for="${id}">${f.label}${req}</label>${input}${f.hint ? html`<span class="hint">${f.hint}</span>` : ''}</div>`;
}
function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    if (!f.name || f.type === 'html') continue;
    if (f.type === 'checkbox') out[f.name] = form.querySelector(`[name="${f.name}"]`).checked;
    else if (f.type === 'multi') out[f.name] = [...form.querySelectorAll(`[name="${f.name}"]:checked`)].map((i) => (f.numeric === false ? i.value : Number(i.value)));
    else {
      const val = form.querySelector(`[name="${f.name}"]`).value.trim();
      out[f.name] = val === '' ? null : f.type === 'number' ? Number(val) : val;
    }
  }
  return out;
}
/** Opens a form in a modal. onSubmit(data) may throw → error shown, modal stays open. */
function formModal({ title, fields, submit = 'حفظ', onSubmit, wide, intro }) {
  const m = modal({
    title, wide,
    body: html`${intro || ''}<form class="form-grid" novalidate>${fields.map(fieldHtml)}<button type="submit" hidden></button></form>`,
    foot: html`<button class="btn primary" data-submit>${submit}</button><button class="btn" data-close>إلغاء</button>`,
  });
  const form = m.el.querySelector('form');
  const btn = m.el.querySelector('[data-submit]');
  const go = async (e) => {
    e && e.preventDefault();
    const data = readForm(form, fields);
    for (const f of fields) if (f.required && (data[f.name] === null || data[f.name] === '')) { toast(`الحقل «${f.label}» مطلوب`, 'err'); return; }
    btn.disabled = true;
    try { await onSubmit(data, m); m.close(); } catch (err) { fail(err); } finally { btn.disabled = false; }
  };
  form.addEventListener('submit', go);
  btn.addEventListener('click', go);
  return m;
}

function showSecret(title, username, password) {
  modal({
    title,
    body: html`<p style="margin-top:0">سلّم هذه البيانات للموظف بشكل شخصي وآمن (لا ترسلها في مجموعات عامة). سيُطلب منه تغيير كلمة المرور فور أول دخول.</p>
      <div class="kv" style="margin-bottom:12px"><div>اسم المستخدم</div><div class="ltr">${username}</div></div>
      <div class="secret">${password}</div>
      <p class="muted small">لن تظهر كلمة المرور مرة أخرى بعد إغلاق هذه النافذة.</p>`,
    foot: html`<button class="btn primary" data-copy>${icon('file')} نسخ البيانات</button><button class="btn" data-close>تم</button>`,
    onMount: (m) => m.el.querySelector('[data-copy]').addEventListener('click', () => {

}

// ---------- small render helpers ----------
const empty = (text, ic = 'inbox') => html`<div class="empty">${icon(ic)}${text}</div>`;
const pageHead = (title, sub, actions, ic) => html`<div class="page-head"><div><h1>${ic ? icon(ic) : ''}${title}</h1>${sub ? html`<p>${sub}</p>` : ''}</div>${actions ? html`<div class="actions">${actions}</div>` : ''}</div>`;
function bars(items, { max, fmt = fmtNum, color } = {}) {
  if (!items.length) return empty('لا توجد بيانات بعد', 'chart');
  const m = max || Math.max(1, ...items.map((i) => i.value));
  return html`<div class="bars">${items.map((i) => html`<div class="bar-row" title="${i.label}: ${fmt(i.value)}">
    <span class="lbl">${i.label}</span><div class="bar-track"><div class="bar-fill" style="width:${raw(String((i.value / m) * 100))}%;${color ? raw('background:' + color) : ''}"></div></div><span class="val">${fmt(i.value)}</span></div>`)}</div>`;
}
function vbars(items, { fmt = fmtNum } = {}) {
  if (!items.length) return empty('لا توجد بيانات بعد', 'chart');
  const m = Math.max(1, ...items.map((i) => i.value));
  return html`<div class="vbars">${items.map((i) => html`<div class="col" title="${i.label}: ${fmt(i.value)}"><span class="vv">${i.value ? fmt(i.value) : ''}</span><div class="b ${i.alt ? 'alt' : ''}" style="height:${raw(String((i.value / m) * 85))}%"></div><span>${i.label}</span></div>`)}</div>`;
}
function tabs(list, active, attr = 'data-tab') {
  return html`<div class="tabs">${list.filter((t) => t.show !== false).map((t) => html`<button ${raw(attr)}="${t.id}" class="${t.id === active ? 'active' : ''}">${t.icon ? icon(t.icon) : ''}${t.label}${t.count ? html` <span class="badge orange">${t.count}</span>` : ''}</button>`)}</div>`;
}
function query() {
  const q = location.hash.split('?')[1] || '';
  return Object.fromEntries(new URLSearchParams(q));
}
function setQuery(params) {
  const [p] = location.hash.split('?');
  const qs = new URLSearchParams({ ...query(), ...params }).toString();
  history.replaceState(null, '', p + (qs ? '?' + qs : ''));
}
function downloadCSV(name, rows, cols) {
  const escCell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.map((c) => escCell(c[1])).join(','), ...rows.map((r) => cols.map((c) => escCell(typeof c[0] === 'function' ? c[0](r) : r[c[0]])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function uploadFile(file, entity_type, entity_id, category) {
  const fd = new FormData();
  fd.append('entity_type', entity_type); fd.append('entity_id', entity_id);
  if (category) fd.append('category', category);
  fd.append('file', file);
  return api('/files', { method: 'POST', body: fd });
}
function pickFile() {
  return new Promise((resolve) => {
    const i = document.createElement('input'); i.type = 'file';
    i.onchange = () => resolve(i.files[0] || null); i.click();
  });
}

async function W(path, data, mode = 'update') {
  try {
    const ref = S.db.doc(path);
    if (mode === 'set') await ref.set(data); else if (mode === 'delete') await ref.delete(); else await ref.update(data);
  } catch (e) {
    if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 600 + Math.random() * 600)); return W(path, data, mode); }
    const msg = ERR[e && e.code] || 'تعذّر الحفظ، أعد المحاولة.';
    toast(msg, 'err');
    const er = new Error(msg); er.silent = true; er.code = (e && e.code) || 'error'; throw er;
  }
}

// ------------------------------------------------------------ boot
function subscribe(coll, key, opts = {}) {
  let q = S.db.collection(coll);
  if (opts.order) q = q.orderBy(opts.order, 'desc');
  if (opts.limit) q = q.limit(opts.limit);
  q.onSnapshot((snap) => {
    const o = {}; for (const d of snap.docs) o[d.id] = d.data();
    S[key] = o; if (!snap.metadata.fromCache) S.loaded[key] = true;
    schedule();
  }, (e) => { S.loaded[key] = true; if (e.code === 'revoked') S.revoked = true; schedule(); });
}

async function boot() {

  if (!window.claude) return mount(document.getElementById('root'), splash('افتح هذا الرابط من داخل Claude وأنت مسجّل الدخول.', true));
  const [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets').catch(() => null)]);
  S.db = db; S.user = user; S.assets = assets;
  if (!db || !user) return mount(document.getElementById('root'), splash('لا يمكن تشغيل النظام هنا. سجّل الدخول إلى Claude ثم افتح الرابط الذي شاركه معك المضيف الرئيسي.', true));
  S.uid = await user.id(); S.isOwner = await user.isOwner(); S.writable = await user.can('data.write');

  S.myName = await user.name();
  S.db.doc('config/perms').onSnapshot((d) => { S.config = d.exists ? d.data() : null; S.loaded.config = true; schedule(); }, () => { S.loaded.config = true; schedule(); });
  S.db.doc(`data/users/${S.uid}/state`).onSnapshot((d) => { S.mine = d.exists ? d.data() : {}; schedule(); }, () => { S.mine = {}; });
  subscribe('staff', 'staff'); subscribe('join', 'join');
  ['projects', 'requests', 'errors', 'suppliers', 'tasks', 'corr'].forEach((c) => subscribe(c, c));
  subscribe('ann', 'ann'); subscribe('chat', 'chat', { order: 'day', limit: 120 });
  setTimeout(() => { if (!S.loaded.staff) { S.slow = true; schedule(); } }, 10000);
  window.addEventListener('hashchange', () => { closeMenus(); schedule(true); });
  bindGlobal();
}

let pending = false; let lastPage = '';
function schedule(scrollTop) {
  if (scrollTop) UI.scrollTop = true;
  if (pending) return; pending = true;
  requestAnimationFrame(() => { pending = false; renderApp(); });
}

let gateKey = '';
function gate() {
  gateKey = 'x';
  if (S.revoked) return splash('سُحبت صلاحية وصولك إلى هذه الصفحة.', true);
  if (!S.loaded.staff || !S.loaded.config) return S.slow ? splash('تعذّر الوصول إلى البيانات حتى الآن. تحقّق من اتصالك بالإنترنت؛ ستظهر البيانات تلقائيًا عند عودته.', true) : splash('جارٍ تحميل البيانات…');
  const s = me();
  if (!s && S.isOwner) { gateKey = 'owner'; return ownerSetup(); }
  if (!s && !S.join[S.uid]) gateKey = 'join';
  if (!s) return S.join[S.uid] ? splash('تم استلام طلب انضمامك ✔ بانتظار موافقة المضيف الرئيسي وتحديد إدارتك وصلاحياتك. ستُفتح لك مساحتك تلقائيًا فور الموافقة.') : joinForm();

}

function renderApp() {
  const root = document.getElementById('root');
  const g = gate();
  if (g) {
    const typing = root.querySelector('#gate-form') && root.dataset.gate === gateKey;
    if (!typing) { mount(root, g); root.dataset.gate = gateKey; }
    lastPage = ''; return;
  }
  root.dataset.gate = '';
  if (!root.querySelector('.app')) { mount(root, shell()); lastPage = ''; }
  // sidebar badges & topbar
  mount(document.getElementById('nav'), navHtml());
  const n = notifs().filter((x) => x.isNew).length;
  const dot = document.getElementById('bell-dot'); dot.textContent = n > 99 ? '99+' : n; dot.hidden = !n;
  const page = document.getElementById('page');
  const { name, param } = parseRoute();
  const key = name + ':' + (param || '');

  const keep = ae && ae.id && page.contains(ae) ? { id: ae.id, v: ae.value, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const chatBox = document.getElementById('msgs'); const nearBottom = !chatBox || chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 140; const oldTop = chatBox && chatBox.scrollTop;
  let content;
  try { content = routeContent(name, param); } catch (e) { console.error(e); content = html`<div class="card card-pad empty">${icon('alert')}حدث خطأ في عرض الصفحة</div>`; }
  mount(page, content);
  if (keep) { const el = document.getElementById(keep.id); if (el) { if ('value' in el && keep.v !== undefined && el.value !== keep.v) el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch { /* */ } } }
  const box = document.getElementById('msgs');
  if (box) { if (key !== lastPage || nearBottom) box.scrollTop = box.scrollHeight; else box.scrollTop = oldTop; }
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + (NAV_ALIAS[name] || name)));
  if (key !== lastPage && UI.scrollTop) { window.scrollTo(0, 0); UI.scrollTop = false; }
  if (name === 'chat') markChatSeen();
  lastPage = key;
}
const NAV_ALIAS = { project: 'projects', request: 'requests', '': 'home' };
function parseRoute() {
  const h = location.hash.replace(/^#/, '') || 'home';
  const m = /^(project|request|chat)-(.+)$/.exec(h);

}

function myQueue() {

    if (p.status !== 'active') continue;

    const s = REQUEST_STAGES[r.stage - 1];

  };
  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (t && root.contains(t)) { e.preventDefault(); const f = A[t.dataset.act]; if (f) Promise.resolve(f(t, e)).catch((er) => { if (er && er.message && !er.code) toast(er.message, 'err'); }); return; }

async function saveConfig(kind, key, val) {
  const c = S.config || {};
  const next = { roles: { ...(c.roles || {}) }, depts: { ...(c.depts || {}) } };
  next[kind][key] = val;
  await W('config/perms', next, 'set');
}
let sending = false;
async function sendMsg() {
  const ta = document.getElementById('mbody'); if (!ta || sending) return;
  const body = ta.value.trim(); if (!body) return;
  sending = true; ta.value = '';
  const ch = UI.chatCh; const day = todayStr(); const docId = `${ch}_${day}`;
  const mentions = activeStaff().filter((s) => s.name && body.includes('@' + s.name)).map((s) => s.id);
  const msg = { by: S.uid, body, at: now(), reply: UI.reply ? UI.reply.id : null, mentions };
  const mid = nid();
  try {
    if (S.chat[docId]) await W('chat/' + docId, { msgs: { [mid]: msg } });
    else { try { await S.db.doc('chat/' + docId).update({ msgs: { [mid]: msg } }); } catch { await W('chat/' + docId, { ch, day, msgs: { [mid]: msg } }, 'set'); } }
    UI.reply = null; UI.mention = null; schedule();
  } catch { ta.value = body; } finally { sending = false; }
}
function searchBox(q) {
  const box = document.getElementById('gsearch-res'); if (!box) return;
  if (q.length < 2) { box.hidden = true; return; }
  const out = [];
  if (can('projects.view')) vals(S.projects).filter((p) => `${p.title} ${p.code} ${p.donor || ''}`.includes(q)).slice(0, 8).forEach((p) => out.push(['مشروع', `${p.code} — ${p.title}`, '#project-' + p.id]));

  if (can('logistics.view')) vals(S.suppliers).filter((s) => s.name.includes(q)).slice(0, 5).forEach((s) => out.push(['مورد', s.name, '#logistics']));
  mount(box, out.length ? out.map(([t, l, h]) => html`<a href="${h}"><span class="badge">${t}</span><span>${l}</span></a>`) : html`<div class="empty small">لا نتائج</div>`);
  box.hidden = false;
}
